<text x="40" y="955" font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, Heiti SC, sans-serif" font-size="14" fill="#444" text-anchor="start" font-weight="normal">3) 风扇黄线不接，单独热缩；4) NTC 引线远离 220 V、继电器与整流桥；5) 控制板用尼龙柱固定，避免与市电走线交叉。</text>
